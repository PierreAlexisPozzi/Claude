# Site GitHub Pages du dépôt (source « GitHub Actions » dans Settings → Pages).
# Le site publié réunit :
#   - à la racine : le contenu de la branche gh-pages (PEA Tracker), copié tel quel, sans les fichiers cachés ;
#   - dans /val-des-sapins/ : le jeu compilé (npm run build de val-des-sapins/web), jamais versionné.
# Il se relance à chaque modification du jeu, et à chaque push sur gh-pages si ce fichier y est aussi présent.
# Hors push sur la branche du jeu (gh-pages, lancement manuel), le jeu est pris sur la branche VDS_BRANCH ci-dessous.
name: Pages (PEA Tracker + Val des Sapins)
on:
  workflow_dispatch: {}
  push:
    branches: [gh-pages, claude/quirky-lamport-iqfb8a]
    paths: ['val-des-sapins/web/**', 'val-des-sapins/CREDITS.md', '.github/workflows/pages.yml', '*.html']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
env:
  VDS_BRANCH: claude/quirky-lamport-iqfb8a   # branche du jeu (à passer sur la branche par défaut après fusion)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name == env.VDS_BRANCH && github.sha || env.VDS_BRANCH }}
          path: src
      - name: Site existant (branche gh-pages)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: gh-pages, path: site }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: src/val-des-sapins/web/package-lock.json }
      - name: Compilation du jeu
        working-directory: src/val-des-sapins/web
        run: npm ci && npm run build
      - name: Assemblage du site
        run: |
          mkdir _site
          cp -r site/. _site/
          find _site -maxdepth 1 -name '.*' ! -name . -exec rm -rf {} +   # .git, .github
          rm -rf _site/val-des-sapins
          cp -r src/val-des-sapins/web/dist _site/val-des-sapins
          test -f _site/index.html && test -f _site/val-des-sapins/index.html
          du -sh _site _site/val-des-sapins
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}val-des-sapins/' }
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
